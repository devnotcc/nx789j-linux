# Game-mode thermal limits (nx-gamemode binds this over /vendor/etc/thermal-engine.conf and
# restarts thermal-engine while a game runs). Same as the stock file, except that the skin
# temperature steps for the CPU and GPU clock limits start at 60 C instead of 43 C / 46 C.
# Charging control and the reporting monitors are unchanged.

[BATTERY_CHARGING_CTL]
algo_type monitor
sampling 1000
sensor         skin-msm-therm
thresholds     40000   41000   42000    43000     44000     45000    50000    52000    90000
thresholds_clr 39000   40000   41000    42000     43000     44000    45000    50000    52000
actions        battery battery battery  battery   battery   battery  battery  battery  battery
action_info    2       3       4        5         6         8        9        10       10

[SKIN_CPU_MONITOR]
algo_type        monitor
sampling         1000
sensor           skin-msm-therm
thresholds       60000                        62000                      64000                      66000                      68000                     70000
thresholds_clr   58000                        60000                      62000                      64000                      66000                     68000
actions          cpu-cluster0+cpu-cluster1    cpu-cluster0+cpu-cluster1  cpu-cluster0+cpu-cluster1  cpu-cluster0+cpu-cluster1  cpu-cluster0+cpu-cluster1 cpu-cluster0+cpu-cluster1
action_info      2400000+2841600              2227200+2649600            1996800+2438400            1785600+2246400            1785600+1958400           1555200+1689600

[SKIN_GPU_MONITOR]
algo_type      monitor
sampling       1000
sensor         skin-msm-therm
thresholds     60000         62000            64000          66000
thresholds_clr 58000         60000            62000          64000
actions        gpu           gpu              gpu            gpu
action_info    832000000     607000000        525000000      389000000

# With the skin limits out of the way the GPU itself reaches 105-109 C within two minutes at
# 1100-1200 MHz (measured, Superposition through Proton), i.e. the kernel's first trip point.
# Step down earlier, by the chip temperature, so that it settles below 100 C.
[GPU_DIE_0]
algo_type      monitor
sampling       1000
sensor         gpuss-0
thresholds     92000         97000
thresholds_clr 86000         92000
actions        gpu           gpu
action_info    967000000     832000000

