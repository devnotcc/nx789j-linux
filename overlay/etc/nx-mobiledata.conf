# Mobile data in Debian (nx-mobiledata.service). Android's own settings are not changed.
#   slot = auto | 1 | 2      auto: the first SIM that is unlocked and registered (a SIM with a
#                             PIN lock cannot be used here: nobody enters the PIN on a Linux boot)
#   apn  = auto | <name>     auto: the APN chosen in Android for that carrier, else its default APN
#   ip   = auto | ipv4 | ipv6 | ipv4v6   (auto: the APN's protocol; only IPv4 is configured)
#   metric = route priority; Wi-Fi (NetworkManager) uses 600, so Wi-Fi wins while connected
enabled = yes
slot = auto
apn = auto
ip = auto
metric = 700
