# The phone's microphone as a PipeWire source: the headset mic while a headset is in the
# 3.5 mm jack, otherwise the built-in mic. Raw 48 kHz mono S16 comes from a FIFO that nx-jack
# fills from the vendor capture path on the Android side - only while something records (it
# watches this source's state), so the mic is not open the rest of the time.
# Low priority on purpose: Bluetooth and USB headset mics become the default input when they
# connect.
context.modules = [
    {   name = libpipewire-module-pipe-tunnel
        args = {
            tunnel.mode = source
            pipe.filename = "/run/nx-mic.raw"
            audio.format = S16LE
            audio.rate = 48000
            audio.channels = 1
            audio.position = [ MONO ]
            node.name = "nx-mic"
            stream.props = {
                node.description = "Phone microphone"
                priority.session = 600
                priority.driver = 600
            }
        }
    }
]
