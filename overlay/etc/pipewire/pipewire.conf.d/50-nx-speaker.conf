# The phone's speaker as a PipeWire sink. Audio is written as raw 48 kHz stereo S16 into a FIFO;
# nx-audio-feed forwards it to the vendor audio path on the Android side.
context.modules = [
    {   name = libpipewire-module-pipe-tunnel
        args = {
            tunnel.mode = sink
            pipe.filename = "/run/nx-audio.raw"
            audio.format = S16LE
            audio.rate = 48000
            audio.channels = 2
            audio.position = [ FL FR ]
            node.name = "nx-speaker"
            stream.props = {
                node.description = "Phone speaker"
                priority.session = 2000
                priority.driver = 2000
            }
        }
    }
]
