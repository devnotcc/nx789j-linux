# NX789J: only the Wi-Fi interface is NetworkManager's; the modem (rmnet), tunnel and dummy
# interfaces belong to the Android side.
[main]
plugins=keyfile
dns=default
# /etc/resolv.conf is built by nx-resolv (NetworkManager servers + mobile data DNS)
rc-manager=unmanaged

[keyfile]
unmanaged-devices=except:interface-name:wlan0

[device]
wifi.scan-rand-mac-address=no

[connection]
wifi.cloned-mac-address=permanent
wifi.powersave=2
