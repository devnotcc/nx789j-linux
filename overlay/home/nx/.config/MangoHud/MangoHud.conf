# In-game overlay (MangoHud). Enabled for everything started from Steam (MANGOHUD=1 in
# nx-steam-arm64).  Right Shift + F12 hides / shows it.
toggle_hud=Shift_R+F12
position=top-left
font_size=20
background_alpha=0.4

# (entries appear in this order; custom_text/exec lines need the non-legacy layout)
legacy_layout=false
gpu_stats=0
fps
frametime
frame_timing
cpu_stats
ram

# This GPU is not known to MangoHud: one line read from the kernel's Adreno driver.
# (LD_PRELOAD= : Steam's preload libraries do not exist for these helper commands and would
# print loader errors into the overlay)
# (an empty label gives the line its own row)
custom_text= 
exec=LD_PRELOAD= sh /home/nx/.config/MangoHud/hudline.sh 2>/dev/null
