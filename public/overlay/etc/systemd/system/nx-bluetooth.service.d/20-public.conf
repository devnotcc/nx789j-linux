# bluebinder needs hci_vhci, which the kernel's boot image doesn't have. The image ships
# /usr/local/lib/modules/hci_vhci.ko built for the EvoX/LineageOS kernel of these releases
# (6.6.92, tools/gki/build-hci-vhci.sh in the kernel repo); on another kernel it won't load.
# Without the module file the service is skipped instead of failing every 5 s.
[Unit]
ConditionPathExists=|/usr/local/lib/modules/hci_vhci.ko
ConditionPathExists=|/sys/module/hci_vhci
