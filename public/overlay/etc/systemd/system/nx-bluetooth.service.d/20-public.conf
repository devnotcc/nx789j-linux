# The public image carries no kernel modules, and bluebinder needs hci_vhci (not part of kernel
# 2's boot image). Without the module the service is skipped instead of failing every 5 s;
# copy hci_vhci.ko for kernel 2 to /usr/local/lib/modules/ to switch Bluetooth on.
[Unit]
ConditionPathExists=|/usr/local/lib/modules/hci_vhci.ko
ConditionPathExists=|/sys/module/hci_vhci
